[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yfs-xrd-refinement"
version = "0.1.0"
description = "Automated multi-stage XRD refinement with a Q-Learning enhanced workflow."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "zgca Contributors" }]
keywords = ["XRD", "Rietveld", "materials", "diffraction", "refinement"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Topic :: Scientific/Engineering",
]
dependencies = [
  "numpy>=1.21",
  "scipy>=1.7",
  "torch>=1.12",
  "matplotlib>=3.5",
  "pymatgen>=2022.0",
]

[project.scripts]
yfs-xrd-refine = "yfs_xrd_refinement.cli:standard"
yfs-xrd-ql-refine = "yfs_xrd_refinement.cli:qlearning"
yfs-xrd-batch-refine = "yfs_xrd_refinement.cli:batch"

[project.urls]
Repository = "https://gitee.com/zgcai/rlxrdrefinement"
Documentation = "README.md"

[tool.setuptools.packages.find]
where = ["src"]
